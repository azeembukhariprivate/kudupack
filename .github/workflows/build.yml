name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KUDUPACK/KUDUPACK.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart('v', 'V') }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Is this a new version?
        id: rel
        shell: pwsh
        run: |
          # A push to main whose version has no tag yet gets a release of its own.
          $new = "false"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | Out-Null
            if ($LASTEXITCODE -eq 2) { $new = "true" }
            elseif ($LASTEXITCODE -ne 0) { Write-Host "Couldn't check the tags (exit code $LASTEXITCODE); no release this time." }
          }
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "New release: $new"
          $global:LASTEXITCODE = 0

      - name: Test extraction safety (harmful names, existing files)
        shell: pwsh
        run: dotnet run --project tests/KUDUPACK.Tests -c Release

      - name: Build
        shell: pwsh
        run: dotnet build src/KUDUPACK/KUDUPACK.csproj -c Release "-p:Version=${{ steps.ver.outputs.version }}" -o out/KUDUPACK

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse out/KUDUPACK | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path out/KUDUPACK/* -DestinationPath "artifacts/KUDUPACK-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\out\KUDUPACK" "/O$PWD\artifacts" installer\KUDUPACK.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: KUDUPACK-${{ steps.ver.outputs.version }}
          path: artifacts/*

      - name: Add a copy of the installer without the version in its name
        if: github.ref_type == 'tag' || steps.rel.outputs.new == 'true'
        shell: pwsh
        run: Copy-Item "artifacts/KUDUPACK-${{ steps.ver.outputs.version }}-setup.exe" "artifacts/KUDUPACK-setup.exe"

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: KUDUPACK ${{ steps.ver.outputs.version }}
          files: artifacts/*
          generate_release_notes: true

      - name: Give the latest release a copy of the installer without the version in its name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.new != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The README's download button links to releases/latest/download/KUDUPACK-setup.exe.
          $json = gh release view --json tagName,assets 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $json) { Write-Host "No release yet."; $global:LASTEXITCODE = 0; exit 0 }
          $latest = $json | ConvertFrom-Json
          $names = @($latest.assets | ForEach-Object { $_.name })
          if ($names -contains "KUDUPACK-setup.exe") { Write-Host "$($latest.tagName) already has KUDUPACK-setup.exe."; exit 0 }
          $versioned = $names | Where-Object { $_ -like "KUDUPACK-*-setup.exe" } | Select-Object -First 1
          if (-not $versioned) { Write-Host "$($latest.tagName) has no installer."; exit 0 }
          New-Item -ItemType Directory -Force latest | Out-Null
          gh release download $latest.tagName --pattern $versioned --dir latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "latest/$versioned" latest/KUDUPACK-setup.exe
          gh release upload $latest.tagName latest/KUDUPACK-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
